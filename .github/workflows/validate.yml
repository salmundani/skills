name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - run: ./scripts/validate.py
      - name: Check README skills table is current
        run: |
          ./scripts/validate.py --update-readme
          git diff --exit-code README.md
